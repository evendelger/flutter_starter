# Базовый набор — very_good_analysis (строгий, включает strict-casts/inference/raw-types).
# Ниже только отличия от него: что дополнительно включено, что выключено и что поднято до error.
# Всё, что перечислено здесь, реально выполняется — проверяется `make lint`.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "build/**"
    - "android/**"
    - "ios/**"
    - "assets/**"
    - "**/*.g.dart" # json_serializable, drift, retrofit
    - "**/*.freezed.dart"
    - "**/*.gen.dart" # flutter_gen
    - "**/*.gr.dart" # auto_route
    - "**/*.config.dart"
    - "**/generated/**"
    - "lib/src/core/constant/l10n/arb/app_localizations*.dart" # flutter gen-l10n

  errors:
    # Ошибки — нарушение ломает сборку в CI и подсвечивается в IDE красным
    always_declare_return_types: error
    avoid_dynamic_calls: error
    avoid_setters_without_getters: error
    avoid_void_async: error
    cancel_subscriptions: error
    close_sinks: error # в very_good_analysis выключено (ignore) — возвращаем
    constant_identifier_names: error
    discarded_futures: error
    unawaited_futures: error

    # Предупреждения
    avoid_slow_async_io: warning
    avoid_type_to_string: warning
    comment_references: warning
    use_build_context_synchronously: warning

formatter:
  trailing_commas: preserve

linter:
  rules:
    # === Дополнительно к very_good_analysis ===
    avoid_implementing_value_types: true # Не реализовывать value-type интерфейсы вручную
    close_sinks: true # Обязательное закрытие Sink/StreamController
    no_runtimeType_toString: true # runtimeType.toString нестабилен после обфускации
    use_decorated_box: true # DecoratedBox вместо Container только с decoration

    # === Выключено из very_good_analysis ===
    public_member_api_docs: false # Приложение, а не библиотека: doc-комментарии по месту, не на каждом члене
    one_member_abstracts: false # Интерфейс I* у репозитория/DAO обязателен, даже с одним методом

# Правила bloc_lint. Читаются только CLI `bloc lint` (пакет bloc_tools, ставится глобально —
# как dev-зависимость конфликтует с freezed/json_serializable по версии analyzer)
# и расширениями bloc для VS Code / IntelliJ. `flutter analyze` их не видит.
# Запуск: `make bloc-lint` (входит в `make lint`).
bloc:
  rules:
    - avoid_flutter_imports # Логика блока не зависит от Flutter
    - avoid_public_bloc_methods # Взаимодействие с блоком — только через события
    - avoid_public_fields # Публичные поля обходят состояние
    - prefer_file_naming_conventions # x_bloc.dart / x_cubit.dart
    - prefer_void_public_cubit_methods # Публичные методы cubit ничего не возвращают — результат в состоянии
