# Проверки шаблона. Локальный эквивалент job `check` — `make check` (после кодогенерации).
#
# Сгенерированный код (*.g.dart, *.freezed.dart, *.gr.dart, flutter_gen) не хранится в git,
# поэтому CI всегда генерирует его с нуля: устаревший локальный .gr.dart, который не виден
# `analyze`, здесь невозможен — расхождение аннотаций и кода роняет analyze/test/build.
# Исключение — l10n (app_localizations*.dart под git): проверяется, что он перегенерирован.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install bloc CLI
        run: |
          dart pub global activate bloc_tools
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Dependencies
        run: |
          flutter pub get
          (cd packages/client_api && dart pub get)

      - name: Format
        run: make format-check

      - name: Localization is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/src/core/constant/l10n

      - name: Codegen
        run: |
          (cd packages/client_api && dart run build_runner build -d)
          dart run build_runner build -d

      - name: Analyze
        run: make analyze

      - name: bloc lint
        run: make bloc-lint

      - name: Test
        run: make test

  build-android:
    name: Build Android (debug, development)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Dependencies and codegen
        run: |
          flutter pub get
          (cd packages/client_api && dart pub get && dart run build_runner build -d)
          dart run build_runner build -d

      - name: Build APK
        run: flutter build apk --debug --flavor development --dart-define-from-file=config/development.json
